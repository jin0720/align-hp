<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>LINEリッチメニュー画像生成（2500x1686）</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&display=swap');

    html, body { margin: 0; background: #fff; }

    /* LINE リッチメニュー（大）: 2500 x 1686 */
    #capture-area {
      width: 2500px;
      height: 1686px;
      background: #fff;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      font-family: 'Shippori Mincho', serif;
      color: #222;
      position: relative;
    }

    .tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      text-align: center;
    }

    /* タイルの間の金色の細線（端は余白をあける） */
    .tile::after {
      content: "";
      position: absolute;
      background: #d8bf72;
    }
    .tile.col-1::after, .tile.col-2::after { right: 0; top: 70px; bottom: 70px; width: 3px; }
    .tile.row-1::before {
      content: "";
      position: absolute;
      background: #d8bf72;
      left: 70px; right: 70px; bottom: 0; height: 3px;
    }

    .icon { width: 250px; height: 250px; margin-bottom: 56px; }
    .icon svg { width: 100%; height: 100%; }

    .title {
      font-size: 84px;
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: 0.04em;
    }
    .title.two-line { font-size: 76px; }

    .subtitle {
      margin-top: 22px;
      font-size: 48px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
  </style>
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="24" y2="24">
        <stop offset="0%" stop-color="#e6c76a" />
        <stop offset="50%" stop-color="#b8923a" />
        <stop offset="100%" stop-color="#e2c36a" />
      </linearGradient>
    </defs>
  </svg>

  <div id="capture-area">
    <div class="tile col-1 row-1">
      <div class="icon"><i data-lucide="hand-heart"></i></div>
      <div class="title">マッサージ予約</div>
      <div class="subtitle">Massage Booking</div>
    </div>
    <div class="tile col-2 row-1">
      <div class="icon"><i data-lucide="message-circle-question"></i></div>
      <div class="title">質問する</div>
      <div class="subtitle">Ask a Question</div>
    </div>
    <div class="tile row-1">
      <div class="icon"><i data-lucide="dumbbell"></i></div>
      <div class="title">トレーニング予約</div>
      <div class="subtitle">Training Booking</div>
    </div>

    <div class="tile col-1">
      <div class="icon"><i data-lucide="globe"></i></div>
      <div class="title">公式サイト</div>
      <div class="subtitle">Official Site</div>
    </div>
    <div class="tile col-2">
      <div class="icon"><i data-lucide="tag"></i></div>
      <div class="title">料金・メニュー</div>
      <div class="subtitle">Price &amp; Menu</div>
    </div>
    <div class="tile">
      <div class="icon"><i data-lucide="clipboard-check"></i></div>
      <div class="title two-line">予約の確認・<br>変更・キャンセル</div>
      <div class="subtitle">Manage Booking</div>
    </div>
  </div>

  <script>
    lucide.createIcons({ attrs: { stroke: 'url(#gold)', 'stroke-width': 1.3 } });

    // 画像として保存する場合（ブラウザで開いて Ctrl/Cmd+S ではなく、このボタン相当の呼び出しを使う）
    function downloadImage() {
      html2canvas(document.getElementById('capture-area'), { scale: 1, backgroundColor: '#ffffff' }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'line_rich_menu.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }
  </script>
</body>
</html>
